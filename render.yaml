# Despliegue de la demo de FAKTU en Render (Blueprint): app web + API + PostgreSQL.
# Render → New → Blueprint → elige este repositorio y la rama a publicar.
# Modo práctica: el simulador emite los comprobantes (sin validez SUNAT).
services:
  - type: web
    name: faktu
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: faktu-db
          property: connectionString
      - key: DB_AUTO_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SECRETS_MASTER_KEY
        generateValue: true
      - key: PUBLIC_RECEIPT_LINK_SECRET
        generateValue: true
      - key: BILLING_PROVIDER
        value: mock
      - key: ALLOW_MOCK_BILLING
        value: "true"
      - key: DELIVERY_PROVIDER
        value: mock
      - key: DEMO_AUTOSEED
        value: "true"

databases:
  - name: faktu-db
    plan: free
    databaseName: faktu
    user: faktu
