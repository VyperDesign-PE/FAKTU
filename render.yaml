# Despliegue de FAKTU en Render (Blueprint): app web + API + PostgreSQL con HTTPS.
# Render → New → Blueprint → elige este repositorio y la rama a publicar → Apply.
# Configurado para la DEMO pública: modo práctica (sin validez SUNAT), negocio de
# ejemplo cargado al primer arranque y botón "Ver la demo" en la pantalla de ingreso.
services:
  - type: web
    name: faktu
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: faktu-db
          property: connectionString
      - key: DB_AUTO_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SECRETS_MASTER_KEY
        generateValue: true
      - key: PUBLIC_RECEIPT_LINK_SECRET
        generateValue: true
      - key: BILLING_PROVIDER
        value: mock
      - key: ALLOW_MOCK_BILLING
        value: "true"
      - key: DELIVERY_PROVIDER
        value: mock
      - key: DEMO_AUTOSEED
        value: "true"
      - key: DEMO_PUBLIC_LOGIN
        value: "true"
      # Opcional: webhook de Slack/Discord para alertas (documentos atascados, fallas del worker).
      - key: ALERT_WEBHOOK_URL
        sync: false

databases:
  - name: faktu-db
    plan: free
    region: oregon
    databaseName: faktu
    user: faktu
