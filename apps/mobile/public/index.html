<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FAKTU</title>
    <meta name="description" content="Boletas y facturas electrónicas para tu negocio." />
    <meta name="theme-color" content="#101A3D" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FAKTU" />
    <style id="expo-reset">
      /* palette:start (generado desde src/brand/palette.ts; no editar a mano) */
      :root {
        --f-background: #F3F5F8;
        --f-surface: #FFFFFF;
        --f-hover: #F7F9FC;
        --f-tableHead: #F1F4F8;
        --f-primary: #1F4B99;
        --f-primaryText: #1F4B99;
        --f-primaryDark: #173B7A;
        --f-primarySoft: #E6EDF8;
        --f-ink: #0F1B33;
        --f-inkSoft: #1A2A47;
        --f-mint: #19C58B;
        --f-mintSoft: #DDF4E8;
        --f-onInkMuted: #B9C4D9;
        --f-onInkAccent: #8FB0EA;
        --f-onInkWarning: #F5B544;
        --f-success: #17703F;
        --f-successSoft: #ECF6F0;
        --f-successBorder: #BFDCCB;
        --f-warning: #8A5300;
        --f-warningSoft: #FBF4E4;
        --f-warningBorder: #E6CE94;
        --f-danger: #B42318;
        --f-dangerSoft: #FDF1F0;
        --f-dangerBorder: #EFC1BD;
        --f-infoSoft: #EEF3FA;
        --f-infoBorder: #C9D6EA;
        --f-mutedSoft: #EBEEF3;
        --f-text: #1A2332;
        --f-muted: #586374;
        --f-border: #D8DEE8;
        --f-blue: #1F4B99;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --f-background: #0C1320;
        --f-surface: #131C2E;
        --f-hover: #192438;
        --f-tableHead: #16203A;
        --f-primary: #3A66BE;
        --f-primaryText: #8FB0EA;
        --f-primaryDark: #2F55A0;
        --f-primarySoft: #1A2B4D;
        --f-ink: #0A101D;
        --f-inkSoft: #172036;
        --f-mint: #19C58B;
        --f-mintSoft: #123428;
        --f-onInkMuted: #B9C4D9;
        --f-onInkAccent: #8FB0EA;
        --f-onInkWarning: #F5B544;
        --f-success: #4CC38A;
        --f-successSoft: #10281C;
        --f-successBorder: #1F4A33;
        --f-warning: #F0B24A;
        --f-warningSoft: #2E2410;
        --f-warningBorder: #584318;
        --f-danger: #F2877E;
        --f-dangerSoft: #341815;
        --f-dangerBorder: #642B26;
        --f-infoSoft: #16233F;
        --f-infoBorder: #2B3E66;
        --f-mutedSoft: #1B2740;
        --f-text: #E6EAF2;
        --f-muted: #9AA6BA;
        --f-border: #26324A;
        --f-blue: #8FB0EA;
        color-scheme: dark;
      }
      /* palette:end */
      html, body { height: 100%; }
      body { overflow: hidden; background: var(--f-background); color: var(--f-text); }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Activa JavaScript para usar FAKTU.</noscript>
    <div id="root"></div>
    <script>
      // Aplica el modo elegido antes de pintar para evitar el parpadeo claro/oscuro.
      try {
        var saved = localStorage.getItem("faktu_theme_mode");
        if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    </script>
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
