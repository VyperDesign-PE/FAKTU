<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FAKTU</title>
    <meta name="description" content="Boletas y facturas electrónicas para tu negocio." />
    <meta name="theme-color" content="#101A3D" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FAKTU" />
    <style id="expo-reset">
      /* palette:start (generado desde src/brand/palette.ts; no editar a mano) */
      :root {
        --f-background: #F5F7FC;
        --f-surface: #FFFFFF;
        --f-hover: #EFF3FF;
        --f-tableHead: #F1F4FB;
        --f-primary: #2547A8;
        --f-primaryText: #2547A8;
        --f-primaryDark: #1B3787;
        --f-primarySoft: #E3EAFB;
        --f-ink: #101A3D;
        --f-inkSoft: #1A2757;
        --f-mint: #19C58B;
        --f-mintSoft: #DDF4E8;
        --f-onInkMuted: #C5CEF0;
        --f-onInkAccent: #7C98F5;
        --f-onInkWarning: #F5B544;
        --f-success: #0F7A3E;
        --f-successSoft: #EAF7EF;
        --f-successBorder: #B5DFC4;
        --f-warning: #8A5300;
        --f-warningSoft: #FFF6E0;
        --f-warningBorder: #EBCB85;
        --f-danger: #B42318;
        --f-dangerSoft: #FFF1F0;
        --f-dangerBorder: #F2B8B5;
        --f-infoSoft: #EEF3FF;
        --f-infoBorder: #C7D4F7;
        --f-mutedSoft: #ECEFF6;
        --f-text: #16203F;
        --f-muted: #55607F;
        --f-border: #DDE2EE;
        --f-blue: #2547A8;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --f-background: #0A1127;
          --f-surface: #121B38;
          --f-hover: #1A2548;
          --f-tableHead: #162042;
          --f-primary: #4568E0;
          --f-primaryText: #8FA8FF;
          --f-primaryDark: #3752BD;
          --f-primarySoft: #1B2B5E;
          --f-ink: #0D1531;
          --f-inkSoft: #1A2757;
          --f-mint: #19C58B;
          --f-mintSoft: #123428;
          --f-onInkMuted: #C5CEF0;
          --f-onInkAccent: #7C98F5;
          --f-onInkWarning: #F5B544;
          --f-success: #4CD98F;
          --f-successSoft: #10301F;
          --f-successBorder: #1F5236;
          --f-warning: #F5B544;
          --f-warningSoft: #33280E;
          --f-warningBorder: #5C4818;
          --f-danger: #FF8A80;
          --f-dangerSoft: #3A1815;
          --f-dangerBorder: #6A2B26;
          --f-infoSoft: #16255A;
          --f-infoBorder: #2C3F85;
          --f-mutedSoft: #1F2A52;
          --f-text: #EDF0FB;
          --f-muted: #A3ACCF;
          --f-border: #27325F;
          --f-blue: #8FA8FF;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --f-background: #0A1127;
        --f-surface: #121B38;
        --f-hover: #1A2548;
        --f-tableHead: #162042;
        --f-primary: #4568E0;
        --f-primaryText: #8FA8FF;
        --f-primaryDark: #3752BD;
        --f-primarySoft: #1B2B5E;
        --f-ink: #0D1531;
        --f-inkSoft: #1A2757;
        --f-mint: #19C58B;
        --f-mintSoft: #123428;
        --f-onInkMuted: #C5CEF0;
        --f-onInkAccent: #7C98F5;
        --f-onInkWarning: #F5B544;
        --f-success: #4CD98F;
        --f-successSoft: #10301F;
        --f-successBorder: #1F5236;
        --f-warning: #F5B544;
        --f-warningSoft: #33280E;
        --f-warningBorder: #5C4818;
        --f-danger: #FF8A80;
        --f-dangerSoft: #3A1815;
        --f-dangerBorder: #6A2B26;
        --f-infoSoft: #16255A;
        --f-infoBorder: #2C3F85;
        --f-mutedSoft: #1F2A52;
        --f-text: #EDF0FB;
        --f-muted: #A3ACCF;
        --f-border: #27325F;
        --f-blue: #8FA8FF;
        color-scheme: dark;
      }
      /* palette:end */
      html, body { height: 100%; }
      body { overflow: hidden; background: var(--f-background); color: var(--f-text); }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Activa JavaScript para usar FAKTU.</noscript>
    <div id="root"></div>
    <script>
      // Aplica el modo elegido antes de pintar para evitar el parpadeo claro/oscuro.
      try {
        var saved = localStorage.getItem("faktu_theme_mode");
        if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    </script>
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
